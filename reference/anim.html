<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#070a18;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const cv=document.getElementById('c'), c=cv.getContext('2d');
const W=1920,H=1080,NAME='siwi';
const COL={siwi:'#FF6FA5',spark:'#8B6CFF',pixel:'#29D8F5',test:'#A8F03A',studio:'#5E6A8C',gold:'#FFC83D',red:'#FF5A6E'};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const pr=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-x,3), ei=x=>x*x*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const ebk=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(h,t,k){const a=hex2rgb(h),b=hex2rgb(t);return`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],k))).join(',')})`}
const lite=(h,k)=>mix(h,'#ffffff',k), dark=(h,k)=>mix(h,'#0a0f24',k);
function rgba(h,a){const[r,g,b]=hex2rgb(h);return`rgba(${r},${g},${b},${a})`}
function rr(x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function txt(s,x,y,size,weight,col,align='left',font='Inter'){c.font=`${weight} ${size}px ${font}`;c.fillStyle=col;c.textAlign=align;c.textBaseline='middle';c.fillText(s,x,y)}

/* ---------------- motion helpers ---------------- */
function hop(t,t0,dur,h){
  const u=(t-t0)/dur;
  if(u<-.2||u>1.35)return[0,1,1];
  if(u<0){const k=Math.sin(Math.PI*.5*(u+.2)/.2);return[0,1+.12*k,1-.14*k]}
  if(u<=1){const st=Math.sin(Math.PI*u);return[-h*4*u*(1-u),1-.10*st,1+.16*st]}
  const k=(u-1)/.35,sq=Math.sin(Math.PI*k)*(1-k);return[0,1+.22*sq,1-.24*sq];
}
function idle(t,ph,amp){const a=t*3.2+ph;return[Math.sin(a)*amp,1+.022*Math.sin(a+1.2),1-.022*Math.sin(a+1.2)]}
function motion(t,list,ph,amp){let dy=0,sx=1,sy=1;for(const[t0,d,h]of list){const m=hop(t,t0,d,h);dy+=m[0];sx*=m[1];sy*=m[2]}const i=idle(t,ph,amp);return[dy+i[0],sx*i[1],sy*i[2]]}
function blinkAt(t,times){let b=0;for(const tb of times){const d=t-tb;if(d>0&&d<.16)b=Math.max(b,Math.sin(Math.PI*d/.16))}return b}
function lookK(t,keys){let prev=[0,0],cur=[0,0],tk=-9;for(const k of keys){if(t>=k[0]){prev=cur;cur=[k[1],k[2]];tk=k[0]}}const kk=eo(pr(t,tk,tk+.18));return[lerp(prev[0],cur[0],kk),lerp(prev[1],cur[1],kk)]}
function moodAt(t,list,def){for(const[a,b,m]of list)if(t>=a&&t<b)return m;return def}
function land(t,tl){const d=t-tl;return(d<0||d>.3)?0:Math.sin(Math.PI*d/.3)*(1-d/.3)}

/* ---------------- characters ---------------- */
function eyes(r,look,bl,mood){
  const ex=r*.36,ey=-r*.04+look[1]*r*.07,lx=look[0]*r*.09;
  c.shadowColor='#fff';c.shadowBlur=r*.5;c.fillStyle='#fff';c.strokeStyle='#fff';c.lineCap='round';
  for(const s of[-1,1]){
    const cx=s*ex+lx,cy=ey;
    if(mood==='cheer'){c.lineWidth=r*.11;c.beginPath();c.arc(cx,cy+r*.12,r*.15,Math.PI*1.08,Math.PI*1.92);c.stroke()}
    else if(mood==='meh'){
      c.beginPath();c.roundRect(cx-r*.15,cy-r*.02,r*.3,r*.12,r*.05);c.fill();
      c.shadowBlur=0;c.strokeStyle='rgba(10,15,36,.85)';c.lineWidth=r*.07;c.beginPath();c.moveTo(cx+s*r*.2,cy-r*.2);c.lineTo(cx-s*r*.2,cy-r*.08);c.stroke();
      c.strokeStyle='#fff';c.shadowBlur=r*.5;
    }else{
      let w=r*.27,h=r*.46;
      if(mood==='shock'){w=r*.34;h=r*.58}
      if(mood==='focus'){w=r*.3;h=r*.34}
      h*=(1-.92*bl);
      c.beginPath();c.roundRect(cx-w/2,cy-h/2,w,Math.max(h,2),w/2);c.fill();
    }
  }
  c.shadowBlur=0;
  if(mood==='shock'){c.fillStyle='rgba(10,15,36,.55)';c.beginPath();c.ellipse(lx,r*.38,r*.08,r*.1,0,0,7);c.fill()}
}
function ball(x,y,r,col,o={}){
  const sx=o.sx??1,sy=o.sy??1,a=o.a??1;
  c.save();c.globalAlpha*=a;
  if(o.shadowY!==undefined){const h=Math.max(0,o.shadowY-(y+r)),k=1/(1+h/260);c.fillStyle=`rgba(0,0,0,${.38*k})`;c.beginPath();c.ellipse(x,o.shadowY,r*.95*k,r*.17*k,0,0,7);c.fill()}
  c.translate(x,y);if(o.rot)c.rotate(o.rot);c.scale(sx,sy);
  c.shadowColor=rgba(col,.8);c.shadowBlur=r*.8;
  const g=c.createRadialGradient(-r*.38,-r*.45,r*.08,0,0,r*1.02);
  g.addColorStop(0,lite(col,.5));g.addColorStop(.5,col);g.addColorStop(1,dark(col,.45));
  c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,7);c.fill();c.shadowBlur=0;
  c.fillStyle='rgba(255,255,255,.22)';c.beginPath();c.ellipse(-r*.38,-r*.5,r*.24,r*.12,-.6,0,7);c.fill();
  if(o.hat){c.fillStyle='#14172e';c.fillRect(-r*.42,-r*1.28,r*.84,r*.5);c.fillRect(-r*.7,-r*.82,r*1.4,r*.12);c.fillStyle=COL.red;c.fillRect(-r*.42,-r*.95,r*.84,r*.1)}
  eyes(r,o.look||[0,0],o.blink||0,o.mood||'happy');
  c.restore();
}
function tag(x,y,text,col,a=1){
  c.save();c.globalAlpha*=a;c.font='700 24px Inter';const w=c.measureText(text).width+38;
  rr(x-w/2,y-20,w,40,20);c.fillStyle=rgba(col,.18);c.fill();c.strokeStyle=rgba(col,.95);c.lineWidth=2;c.stroke();
  c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText(text,x,y+1);c.restore();
}

/* ---------------- fx ---------------- */
const CONF=['#FF6FA5','#8B6CFF','#29D8F5','#A8F03A','#FFC83D','#ffffff'];
function confetti(t,t0,x,y,n,seed,spread=Math.PI*1.2,pw=900){
  const d=t-t0;if(d<0||d>1.9)return;const r=rng(seed);
  for(let i=0;i<n;i++){
    const ang=-Math.PI/2+(r()-.5)*spread,sp=pw*(.35+.65*r()),life=1.1+.7*r(),rot0=r()*6,rs=(r()-.5)*14,w=10+r()*10,h=6+r()*6;
    if(d>life)continue;
    const px=x+Math.cos(ang)*sp*d*.9,py=y+Math.sin(ang)*sp*d+.5*1500*d*d;
    c.save();c.globalAlpha=1-pr(d,life*.6,life);c.translate(px,py);c.rotate(rot0+rs*d);c.fillStyle=CONF[i%CONF.length];c.fillRect(-w/2,-h/2,w,h);c.restore();
  }
}
function ring(t,t0,x,y,col,maxR=260,dur=.7,lw=8){const d=pr(t,t0,t0+dur);if(d<=0||d>=1)return;c.save();c.strokeStyle=rgba(col,1-d);c.lineWidth=lw*(1-d)+1;c.beginPath();c.arc(x,y,maxR*eo(d),0,7);c.stroke();c.restore()}
function sparkle(x,y,s,col='#ffffff',a=1){c.save();c.globalAlpha*=a;c.translate(x,y);c.fillStyle=col;c.shadowColor=col;c.shadowBlur=s*.8;c.beginPath();for(let i=0;i<8;i++){const q=i%2?s*.22:s,an=i*Math.PI/4-Math.PI/2;c.lineTo(Math.cos(an)*q,Math.sin(an)*q)}c.closePath();c.fill();c.restore()}
function bez(a,b,p,u){const m=1-u;return[m*m*a[0]+2*m*u*p[0]+u*u*b[0],m*m*a[1]+2*m*u*p[1]+u*u*b[1]]}
function glyph(x,y,kind){
  c.save();c.translate(x,y);c.strokeStyle='#0a0f24';c.fillStyle='#0a0f24';c.lineWidth=5;c.lineCap='round';c.lineJoin='round';
  if(kind==='idea'){c.beginPath();for(let i=0;i<8;i++){const q=i%2?4:15,an=i*Math.PI/4-Math.PI/2;c.lineTo(Math.cos(an)*q,Math.sin(an)*q)}c.closePath();c.fill()}
  else if(kind==='spec'){c.font='800 24px "DejaVu Sans Mono"';c.textAlign='center';c.textBaseline='middle';c.fillText('{}',0,1)}
  else if(kind==='assets'){for(const[a,b]of[[-11,-11],[2,-11],[-11,2],[2,2]]){c.fillRect(a,b,9,9)}}
  else if(kind==='bug'){c.font='900 36px Inter';c.textAlign='center';c.textBaseline='middle';c.fillText('!',0,2)}
  else if(kind==='patch'){c.beginPath();c.moveTo(-12,0);c.lineTo(12,0);c.moveTo(0,-12);c.lineTo(0,12);c.stroke()}
  else if(kind==='ready'){c.beginPath();c.moveTo(-13,1);c.lineTo(-4,10);c.lineTo(14,-9);c.stroke()}
  c.restore();
}
function packet(t,t0,t1,a,b,ctrl,kind,col){
  const u=pr(t,t0,t1);if(u<=0||u>=1)return;
  for(let k=8;k>=0;k--){
    const uu=cl(u-k*.022),[x,y]=bez(a,b,ctrl,eio(uu));
    c.save();c.globalAlpha=k===0?1:.5*(1-k/9);c.shadowColor=col;c.shadowBlur=k===0?34:10;c.fillStyle=col;
    c.beginPath();c.arc(x,y,k===0?30:25-k*1.6,0,7);c.fill();c.restore();
  }
  const[x,y]=bez(a,b,ctrl,eio(u));glyph(x,y,kind);
}

/* ---------------- background / chrome ---------------- */
const BOK=(()=>{const r=rng(11);return Array.from({length:16},(_,i)=>({x:r()*W,y:r()*H,r:90+r()*170,col:[COL.spark,COL.pixel,COL.siwi,COL.test,COL.gold][i%5],ph:r()*6,sp:.2+r()*.3}))})();
const TW=(()=>{const r=rng(5);return Array.from({length:70},()=>({x:r()*W,y:r()*H,s:1+r()*2.2,ph:r()*6}))})();
function bg(t){
  const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0B1030');g.addColorStop(1,'#07091A');c.fillStyle=g;c.fillRect(0,0,W,H);
  for(const b of BOK){const x=b.x+Math.sin(t*b.sp+b.ph)*80,y=b.y+Math.cos(t*b.sp*.8+b.ph)*60,rg=c.createRadialGradient(x,y,0,x,y,b.r);rg.addColorStop(0,rgba(b.col,.17));rg.addColorStop(1,rgba(b.col,0));c.fillStyle=rg;c.fillRect(x-b.r,y-b.r,b.r*2,b.r*2)}
  c.fillStyle='#fff';for(const s of TW){c.globalAlpha=.2+.5*(.5+.5*Math.sin(t*2+s.ph));c.fillRect(s.x,(s.y-t*12*s.s+H*10)%H,s.s,s.s)}c.globalAlpha=1;
}
function chrome(t){
  const o=eo(pr(t,.1,.6));c.save();c.globalAlpha=o;
  ball(106,86,26,COL.siwi,{blink:blinkAt(t,[1.2,5.5,8.3])});
  txt(NAME,148,88,46,800,'#fff');
  c.letterSpacing='2px';txt('PREVIEW · MOCK FOOTAGE · WORKING TITLE',W-80,88,19,500,'rgba(255,255,255,.5)','right','"DejaVu Sans Mono"');c.letterSpacing='0px';
  c.restore();
}
function iris(k){if(k>=1)return;const R=Math.hypot(W,H)/2*k;c.save();c.fillStyle='#05070f';c.beginPath();c.rect(0,0,W,H);c.arc(W/2,H/2,Math.max(R,.001),0,Math.PI*2,true);c.fill('evenodd');c.restore()}
function kcap(t,a,b,words,y=975,size=54){
  if(t<a||t>b)return;c.save();c.font=`800 ${size}px Inter`;c.textBaseline='middle';
  const sp=size*.28,ws=words.map(w=>c.measureText(w[0]).width),total=ws.reduce((s,v)=>s+v,0)+sp*(words.length-1);
  let x=W/2-total/2;const out=1-pr(t,b-.25,b);
  words.forEach((w,i)=>{
    const k=ebk(pr(t,a+i*.09,a+i*.09+.35)),o=pr(t,a+i*.09,a+i*.09+.15)*out;
    c.save();c.globalAlpha=o;c.translate(x+ws[i]/2,y+(1-k)*40);c.scale(.6+.4*k,.6+.4*k);c.textAlign='center';c.shadowColor='rgba(0,0,0,.65)';c.shadowBlur=24;c.fillStyle=w[1]||'#fff';c.fillText(w[0],0,0);c.restore();
    x+=ws[i]+sp;
  });c.restore();
}

/* ---------------- mini game ---------------- */
const stars=(()=>{const r=rng(7);return Array.from({length:90},()=>({x:r()*1100,y:r()*620,z:.2+r()*.8,s:1+Math.floor(r()*3)}))})();
const SP=["....hhhh....","..hhhhhhhh..","..rrrrrrrr..","...ssssss...","...skssks...","...ssssss...","..wwwwwwww..",".wwwwwwwwww.",".ww.wwww.ww.","...wwwwww...","...ww..ww...","..bbb..bbb.."];
const PAL={h:'#2a2438',r:'#ef4444',s:'#f5c9a0',k:'#111',w:'#e5e7eb',b:'#7c5cff'};
function sprite(g,x,y,u,flip){g.save();g.translate(x,y);if(flip){g.translate(0,SP.length*u);g.scale(1,-1)}for(let r=0;r<SP.length;r++)for(let q=0;q<12;q++){const ch=SP[r][q];if(ch!=='.'){g.fillStyle=PAL[ch];g.fillRect(q*u,r*u,u,u)}}g.restore()}
function spike(g,x,base,dir){g.beginPath();g.moveTo(x-20,base);g.lineTo(x,base-44*dir);g.lineTo(x+20,base);g.closePath();g.fill()}
const FS=[866,910,954,1790],CS=[1474,1518],COINS=[[600,430],[660,390],[720,350],[1280,300],[1340,330],[1400,300]];
function drawGame(g,tg,hud){
  const W_=1100,H_=620,SPD=380;
  let gr=g.createLinearGradient(0,0,0,H_);gr.addColorStop(0,'#1b1040');gr.addColorStop(.55,'#3b1a5c');gr.addColorStop(1,'#0e0a24');
  g.fillStyle=gr;g.fillRect(0,0,W_,H_);
  let mg=g.createRadialGradient(830,210,10,830,210,100);mg.addColorStop(0,'#ffd1ec');mg.addColorStop(1,'#ff5fa8');
  g.fillStyle=mg;g.beginPath();g.arc(830,210,92,0,7);g.fill();
  for(const s of stars){const x=(((s.x-tg*40*s.z)%W_)+W_)%W_;g.globalAlpha=.35+.65*s.z;g.fillStyle='#fff';g.fillRect(x,s.y,s.s,s.s)}g.globalAlpha=1;
  for(const[col,amp,sp,base]of[['#1a1038',50,60,430],['#120a2a',40,110,470]]){g.fillStyle=col;g.beginPath();g.moveTo(0,H_);for(let x=0;x<=W_;x+=20)g.lineTo(x,base-amp*Math.sin((x+tg*sp)/110)-amp*.5*Math.sin((x+tg*sp)/47));g.lineTo(W_,H_);g.fill()}
  g.fillStyle='#0c0820';g.fillRect(0,540,W_,80);g.fillRect(0,0,W_,80);
  g.save();g.shadowColor='#22D3EE';g.shadowBlur=24;g.fillStyle='#22D3EE';g.fillRect(0,538,W_,4);g.fillRect(0,78,W_,4);g.restore();
  g.fillStyle='rgba(34,211,238,.25)';for(let x=-((tg*SPD)%60);x<W_;x+=60){g.fillRect(x,560,28,6);g.fillRect(x,54,28,6)}
  g.fillStyle='#FB7185';for(const X of FS){const sx=X-SPD*tg;if(sx>-50&&sx<1150)spike(g,sx,540,1)}for(const X of CS){const sx=X-SPD*tg;if(sx>-50&&sx<1150)spike(g,sx,80,-1)}
  let score=120+Math.floor(tg*90);
  for(const[X,Y]of COINS){const sx=X-SPD*tg;if(sx>235&&sx<1150){g.fillStyle='#FBBF24';g.beginPath();g.arc(sx,Y,15,0,7);g.fill();g.fillStyle='#fff8d6';g.fillRect(sx-4,Y-9,5,9)}else if(sx<=235&&sx>150){const k=(235-sx)/85;g.strokeStyle='rgba(251,191,36,'+(1-k)+')';g.lineWidth=4;g.beginPath();g.arc(sx+60,Y,15+k*34,0,7);g.stroke()}if(sx<=235)score+=50}
  let pos=tg<.7?0:tg<1.2?eio((tg-.7)/.5):tg<2.3?1:tg<2.8?1-eio((tg-2.3)/.5):0;
  const mv=(tg>.7&&tg<1.2)||(tg>2.3&&tg<2.8);
  let y=468+(84-468)*pos+(mv?0:Math.sin(tg*14)*3*(pos>.5?-1:1));
  if(mv){for(let k=1;k<=3;k++){g.globalAlpha=.18/k;sprite(g,200-k*14,y+(pos>.5?k*-20:k*20)*(tg<2?1:-1),6,pos>.5)}g.globalAlpha=1}
  sprite(g,200,y,6,pos>.5);
  if(hud){
    g.font='bold 24px "DejaVu Sans Mono"';g.fillStyle='#fff';g.textAlign='left';g.textBaseline='alphabetic';g.fillText('SCORE '+String(score).padStart(5,'0'),28,36);
    g.textAlign='right';g.fillStyle='#22D3EE';g.fillText('MUSE IMAGE ART  •  MUSE SPARK CODE',W_-28,36);
    if((tg>.7&&tg<1.6)||(tg>2.3&&tg<3.2)){g.textAlign='center';g.fillStyle='rgba(255,255,255,'+(.6+.4*Math.sin(tg*25))+')';g.font='bold 30px "DejaVu Sans Mono"';g.fillText('GRAVITY FLIP',W_/2,160)}
  }
  g.textAlign='left';g.textBaseline='middle';
}
function gameWin(x,y,w,tg,title,glow,hud=true){
  const s=w/1100,bar=Math.max(28,40*Math.max(s,.7)),h=620*s+bar;
  c.save();c.shadowColor=glow;c.shadowBlur=60;rr(x,y,w,h,24);c.fillStyle='#14112b';c.fill();c.shadowBlur=0;c.clip();
  for(let i=0;i<3;i++){c.fillStyle=['#FB7185','#FBBF24','#A3E635'][i];c.beginPath();c.arc(x+22+i*24,y+bar/2,6,0,7);c.fill()}
  txt(title,x+110,y+bar/2+1,Math.max(13,17*Math.max(s,.8)),500,'#8f94b3','left','"DejaVu Sans Mono"');
  c.translate(x,y+bar);c.scale(s,s);drawGame(c,tg,hud&&s>.6);
  c.restore();
  c.save();rr(x,y,w,h,24);c.strokeStyle='rgba(255,255,255,.2)';c.lineWidth=2;c.stroke();c.restore();
  return h;
}

/* =================== SCENE 1 =================== */
const PROMPT=['a space-pirate platformer','where gravity flips when you jump'];
function drawPill(t){
  c.save();c.shadowColor=rgba(COL.spark,.45);c.shadowBlur=70;rr(700,300,1040,210,56);c.fillStyle='rgba(255,255,255,.09)';c.fill();c.shadowBlur=0;
  c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=2;c.stroke();
  c.letterSpacing='3px';txt('DESCRIBE YOUR GAME',744,350,20,600,'rgba(255,255,255,.55)','left','"DejaVu Sans Mono"');c.letterSpacing='0px';
  const n=Math.floor(58*pr(t,2.0,4.6));let rem=n;
  for(let i=0;i<2;i++){const s=PROMPT[i].slice(0,Math.max(0,rem));rem-=PROMPT[i].length;txt(s,744,412+i*58,44,600,'#fff');
    if(((i===0&&n<25)||(i===1&&n>=25))&&n>0&&n<58&&n>=(i?25:0)){const w=c.measureText(s).width;c.fillStyle=COL.pixel;c.fillRect(744+w+6,412+i*58-24,4,48)}}
  const pk=pr(t,4.85,5.05),rl=pr(t,5.05,5.4),sc=t>4.85&&t<5.4?1-.08*Math.sin(Math.PI*cl((t-4.85)/.55)):1;
  c.save();c.translate(1624,466);c.scale(sc,sc);rr(-95,-30,190,60,30);
  const gg=c.createLinearGradient(-95,0,95,0);gg.addColorStop(0,COL.siwi);gg.addColorStop(1,COL.spark);
  c.shadowColor=rgba(COL.siwi,.8);c.shadowBlur=t>4.85&&t<5.6?50:20;c.fillStyle=gg;c.fill();c.shadowBlur=0;
  txt('Generate →',0,2,25,800,'#fff','center');c.restore();
  c.restore();
}
const HLP1=[
  {col:COL.spark,name:'Muse Spark',to:[170,400],from:[-160,80],ctl:[-60,520],t0:5.3,ph:0},
  {col:COL.pixel,name:'Muse Image',to:[340,265],from:[430,-170],ctl:[120,20],t0:5.5,ph:1.4},
  {col:COL.test,name:'Playtest agent',to:[565,385],from:[900,-170],ctl:[760,200],t0:5.7,ph:2.7},
];
function scene1(t){
  bg(t);
